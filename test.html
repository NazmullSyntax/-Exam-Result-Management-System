<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result Management · NumPy</title>
  <!-- Load NumPy via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/numpy-js@0.0.3/dist/numpy.min.js"></script>
  <!-- Alternatively, use a more reliable CDN for a numpy-like library -->
  <script src="https://cdn.jsdelivr.net/npm/numjs@0.16.0/dist/numjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f4f7fc;
      margin: 0;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1a2b4c;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }
    .subhead {
      color: #2c3e66;
      margin-top: 0;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      border-left: 5px solid #3b6ea5;
      padding-left: 1rem;
      background: #e9eff9;
      border-radius: 0 8px 8px 0;
      width: fit-content;
      padding: 0.6rem 1.5rem;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 20, 50, 0.08);
      padding: 1.8rem 2rem;
      margin-bottom: 2rem;
      transition: box-shadow 0.2s;
      border: 1px solid #d9e2ef;
    }
    .card:hover {
      box-shadow: 0 12px 40px rgba(0, 20, 50, 0.12);
    }
    .card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1e3a5f;
      margin-top: 0;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 i {
      font-style: normal;
      font-size: 1.6rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      margin-top: 0.5rem;
      border-radius: 16px;
      overflow: hidden;
    }
    th {
      background: #1e3a5f;
      color: white;
      font-weight: 500;
      text-align: center;
      padding: 1rem 0.8rem;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    td {
      padding: 0.9rem 0.8rem;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
      background-color: white;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover td {
      background: #f0f6ff;
    }
    .rank-badge {
      display: inline-block;
      background: #e9eff9;
      color: #1e3a5f;
      font-weight: 600;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.85rem;
      min-width: 50px;
    }
    .grade-badge {
      display: inline-block;
      font-weight: 600;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      font-size: 0.85rem;
      min-width: 50px;
    }
    .grade-A { background: #d4edda; color: #0b5e2e; }
    .grade-B { background: #d1ecf1; color: #0b4b5e; }
    .grade-C { background: #fff3cd; color: #856404; }
    .grade-D { background: #f8d7da; color: #842029; }
    .grade-F { background: #e2e3e5; color: #41464b; }
    .highlight {
      background: #fef9e7;
      font-weight: 600;
    }
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 1rem;
      justify-content: space-between;
    }
    .stat-item {
      background: #f8fafd;
      border-radius: 18px;
      padding: 1.2rem 1.5rem;
      flex: 1 1 180px;
      border: 1px solid #d0dfee;
    }
    .stat-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4a5b7a;
      font-weight: 500;
    }
    .stat-value {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0b2b4d;
      line-height: 1.3;
    }
    .stat-sub {
      font-size: 0.9rem;
      color: #556b8a;
    }
    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: #6a7b99;
      margin-top: 2rem;
      border-top: 1px solid #d0dfee;
      padding-top: 1.5rem;
    }
    .array-demo {
      background: #f0f4fa;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #1e3a5f;
      margin-top: 1rem;
      border-left: 6px solid #3b6ea5;
      overflow-x: auto;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📊 Exam Result Management</h1>
  <div class="subhead">NumPy arrays · grades · averages · ranking</div>

  <!-- Results table -->
  <div class="card">
    <h2><i>📋</i> Student results &amp; rankings</h2>
    <div style="overflow-x: auto;">
      <table id="resultTable">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Student</th>
            <th>Math</th>
            <th>Physics</th>
            <th>Chemistry</th>
            <th>Biology</th>
            <th>Average</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- filled dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Statistics summary using NumPy -->
  <div class="card">
    <h2><i>📈</i> Class statistics (NumPy)</h2>
    <div class="stats-grid" id="statsContainer">
      <!-- dynamically filled -->
    </div>
    <div class="array-demo" id="arrayDemo">
      <!-- numpy array representation -->
    </div>
  </div>

  <div class="footer-note">
    ⚡ Built with NumPy (via NumJs) · grades computed from averages · ranking is dense (1,2,3...)
  </div>
</div>

<script>
  (function() {
    // ---------- 1. Define student data ----------
    const students = [
      { name: "Alice Chen",    scores: [92, 88, 95, 90] },
      { name: "Bob Martinez",  scores: [78, 85, 70, 82] },
      { name: "Carla Ruiz",    scores: [88, 92, 85, 91] },
      { name: "David Kim",     scores: [65, 70, 62, 68] },
      { name: "Eva Novak",     scores: [95, 98, 94, 97] },
      { name: "Frank Osei",    scores: [82, 79, 88, 84] },
      { name: "Grace Liu",     scores: [70, 75, 68, 72] },
      { name: "Henry Ford",    scores: [55, 60, 52, 58] },
      { name: "Ivy Chen",      scores: [98, 96, 99, 97] },
      { name: "Jamal Adams",   scores: [84, 80, 86, 82] }
    ];

    // ---------- 2. Build NumPy arrays using NumJs (nj) ----------
    // We'll create a 2D array of scores: shape (10, 4)
    const scoreMatrix = nj.array(students.map(s => s.scores));
    // Extract each subject column (for stats)
    const mathScores   = scoreMatrix.slice(null, 0);
    const physicsScores = scoreMatrix.slice(null, 1);
    const chemScores   = scoreMatrix.slice(null, 2);
    const bioScores    = scoreMatrix.slice(null, 3);

    // ---------- 3. Compute average per student using NumPy mean (axis=1) ----------
    // nj.mean with axis=1 returns array of shape (10,)
    const avgArray = nj.mean(scoreMatrix, 1);   // shape (10,)
    // Convert to plain JS array for easier mapping
    const averages = avgArray.tolist();

    // ---------- 4. Assign grades based on average ----------
    function getGrade(avg) {
      if (avg >= 90) return 'A';
      if (avg >= 80) return 'B';
      if (avg >= 70) return 'C';
      if (avg >= 60) return 'D';
      return 'F';
    }

    const grades = averages.map(avg => getGrade(avg));

    // ---------- 5. Compute rank (dense ranking: 1,2,2,3...) ----------
    // Sort unique averages descending, then map rank
    const sortedUnique = [...new Set(averages)].sort((a, b) => b - a);
    const rankMap = new Map();
    sortedUnique.forEach((val, idx) => rankMap.set(val, idx + 1));
    const ranks = averages.map(avg => rankMap.get(avg));

    // ---------- 6. Populate table ----------
    const tbody = document.getElementById('tableBody');
    // Create rows with rank, name, scores, average, grade
    students.forEach((student, i) => {
      const avg = averages[i];
      const grade = grades[i];
      const rank = ranks[i];
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><span class="rank-badge">#${rank}</span></td>
        <td style="font-weight:500; text-align:left; padding-left:1.2rem;">${student.name}</td>
        <td>${student.scores[0]}</td>
        <td>${student.scores[1]}</td>
        <td>${student.scores[2]}</td>
        <td>${student.scores[3]}</td>
        <td style="font-weight:600;">${avg.toFixed(1)}</td>
        <td><span class="grade-badge grade-${grade}">${grade}</span></td>
      `;
      tbody.appendChild(row);
    });

    // ---------- 7. Compute class statistics with NumPy ----------
    const classAvg = nj.mean(avgArray).tolist();        // overall mean of averages
    const classStd = nj.std(avgArray).tolist();         // standard deviation of averages
    const maxAvg = nj.max(avgArray).tolist();
    const minAvg = nj.min(avgArray).tolist();

    // Subject-wise stats using NumPy
    const mathMean = nj.mean(mathScores).tolist();
    const physicsMean = nj.mean(physicsScores).tolist();
    const chemMean = nj.mean(chemScores).tolist();
    const bioMean = nj.mean(bioScores).tolist();

    // Highest average student (first occurrence)
    const topStudentIndex = averages.indexOf(maxAvg);
    const topStudentName = students[topStudentIndex].name;

    // ---------- 8. Render stats cards ----------
    const statsContainer = document.getElementById('statsContainer');
    statsContainer.innerHTML = `
      <div class="stat-item">
        <div class="stat-label">Class average</div>
        <div class="stat-value">${classAvg.toFixed(2)}</div>
        <div class="stat-sub">std dev: ${classStd.toFixed(2)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Highest average</div>
        <div class="stat-value">${maxAvg.toFixed(1)}</div>
        <div class="stat-sub">${topStudentName}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Lowest average</div>
        <div class="stat-value">${minAvg.toFixed(1)}</div>
        <div class="stat-sub">&nbsp;</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Subject means</div>
        <div class="stat-value" style="font-size:1.1rem; line-height:1.7; font-weight:500;">
          Math: ${mathMean.toFixed(1)} · Phys: ${physicsMean.toFixed(1)}<br>
          Chem: ${chemMean.toFixed(1)} · Bio: ${bioMean.toFixed(1)}
        </div>
        <div class="stat-sub">calculated via NumPy mean</div>
      </div>
    `;

    // ---------- 9. Show NumPy array demo ----------
    const arrayDemo = document.getElementById('arrayDemo');
    // Show the raw score matrix and average array from NumPy (print first few elements)
    const scoreMatrixString = scoreMatrix.toString().replace(/\n/g, ' ').substring(0, 120) + ' ...';
    const avgArrayString = avgArray.toString().replace(/\n/g, ' ');
    arrayDemo.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div><span style="font-weight:600;">📐 NumPy score matrix (10x4):</span> ${scoreMatrixString}</div>
        <div><span style="font-weight:600;">📊 NumPy averages (10,):</span> [${avgArray.tolist().map(v => v.toFixed(1)).join(', ')}]</div>
        <div><span style="font-weight:600;">🏆 Ranking (dense):</span> [${ranks.join(', ')}]</div>
      </div>
    `;

    // (Optional) Add some visual hint for top rank
    // Already done via rank badges
  })();
</script>
<!-- Fallback if NumJs fails to load? We could add a second script, but NumJs is reliable via jsdelivr -->
</body>
</html>
